name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MinGW-w64
        run: choco install mingw -y --no-progress

      - name: Embed the dashboard into the exe
        shell: pwsh
        run: python tools/embed_web.py

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;$env:PATH"
          New-Item -ItemType Directory -Force build, dist | Out-Null
          g++ --version
          windres resources/OptimizeKit.rc -O coff -o build/OptimizeKit.res
          g++ -std=c++20 -O2 -municode -mwindows `
            -Isrc -Isrc/core -DCPPHTTPLIB_THREAD_POOL_COUNT=4 `
            src/app/main.cpp src/app/cli.cpp `
            src/core/common.cpp src/core/sysinfo.cpp src/core/tweaks.cpp src/core/cleaner.cpp `
            src/core/engine.cpp src/core/ping.cpp src/core/drivers.cpp src/core/gameboost.cpp `
            src/core/monitor.cpp src/core/netprofile.cpp src/core/scan.cpp `
            src/core/games.cpp src/core/ram.cpp src/core/storage.cpp src/core/logging2.cpp `
            src/core/diagnostics.cpp `
            src/core/diskscope.cpp src/core/reducer.cpp src/core/security.cpp `
            src/core/firmware.cpp src/core/drvupdate.cpp `
            src/server/server.cpp `
            src/ui/ui.cpp src/ui/webframe.cpp `
            build/OptimizeKit.res `
            -o dist/OptimizeKit.exe `
            -Ithird_party/webview2/include `
            -ld2d1 -ldwrite -lwindowscodecs -luser32 -lgdi32 -lgdiplus -lshell32 -ladvapi32 -lole32 -loleaut32 `
            -lshlwapi -liphlpapi -lws2_32 -lwinmm -luxtheme -ldwmapi -lpowrprof -lsetupapi -lpsapi `
            -lpdh -lwininet -luuid -lntdll -lwbemuuid -lcfgmgr32 `
            -static -static-libgcc -static-libstdc++
          if (-not (Test-Path dist/OptimizeKit.exe)) { throw "build failed" }

      - name: Assemble the portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/web/assets/fonts | Out-Null
          New-Item -ItemType Directory -Force dist/web/assets/gamelogos | Out-Null
          New-Item -ItemType Directory -Force dist/web/fonts | Out-Null
          Copy-Item web/index.html, web/style.css, web/app.js dist/web/
          Copy-Item web/assets/fonts/*.ttf dist/web/assets/fonts/ -ErrorAction SilentlyContinue
          Copy-Item web/fonts/*.woff2 dist/web/fonts/ -ErrorAction SilentlyContinue
          Copy-Item web/assets/gamelogos/*.jpg, web/assets/gamelogos/manifest.json dist/web/assets/gamelogos/ -ErrorAction SilentlyContinue
          if (Test-Path WebView2Loader.dll) { Copy-Item WebView2Loader.dll dist/ }
          Get-Item dist/OptimizeKit.exe | Select-Object Name, Length

      - name: Smoke test
        shell: pwsh
        run: |
          & dist/OptimizeKit.exe --list
          & dist/OptimizeKit.exe --info
          $p = Start-Process -PassThru -FilePath dist/OptimizeKit.exe -ArgumentList '--web','8799'
          Start-Sleep -Seconds 4
          $health = Invoke-RestMethod http://127.0.0.1:8799/health
          if (-not $health.ok) { throw "embedded server did not answer" }
          $size = (Invoke-WebRequest http://127.0.0.1:8799/).RawContentLength
          if ($size -lt 5000) { throw "embedded dashboard looks empty ($size bytes)" }
          Stop-Process -Id $p.Id -Force

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''   # CHANGELOG headings are "## [2.9.0]", tags are v2.9.0
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^##\s+\[?$([regex]::Escape($ver))" | Select-Object -First 1).LineNumber
          if (-not $start) { "See CHANGELOG.md for the full history." | Set-Content release-body.md; exit 0 }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($i -gt $start -and $lines[$i] -match '^##\s') { break }
            $body += $lines[$i]
          }
          $body -join "`n" | Set-Content release-body.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizeKit
          path: |
            dist/OptimizeKit.exe
            dist/web/
            OptimizeKit.bat
            OptimizeKit-Admin.bat
            Uninstall-OptimizeKit.bat
            PowerShell/OptimizeKit.ps1

      - name: Zip portable bundle
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Force -Path dist/OptimizeKit.exe, dist/web, OptimizeKit.bat, OptimizeKit-Admin.bat, Uninstall-OptimizeKit.bat, PowerShell, README.md, README.fr.md -DestinationPath dist/OptimizeKit-${{ github.ref_name }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OptimizeKit ${{ github.ref_name }}
          body_path: release-body.md
          overwrite_files: true
          files: |
            dist/OptimizeKit.exe
            dist/OptimizeKit-*.zip
            OptimizeKit.bat
            OptimizeKit-Admin.bat
            Uninstall-OptimizeKit.bat
            PowerShell/OptimizeKit.ps1
